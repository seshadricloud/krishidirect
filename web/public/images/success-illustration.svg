<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="200" cy="200" r="180" fill="#ECFDF5"/>
  <circle cx="200" cy="200" r="140" fill="#D1FAE5"/>
  <circle cx="200" cy="200" r="100" fill="#A7F3D0"/>
  
  <!-- Checkmark Circle -->
  <circle cx="200" cy="200" r="80" fill="#10B981"/>
  
  <!-- Checkmark -->
  <path d="M 170 200 L 190 220 L 230 170" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Confetti -->
  <circle cx="80" cy="100" r="6" fill="#F59E0B"/>
  <circle cx="320" cy="120" r="6" fill="#EF4444"/>
  <circle cx="100" cy="300" r="6" fill="#3B82F6"/>
  <circle cx="300" cy="280" r="6" fill="#8B5CF6"/>
  <rect x="150" y="80" width="8" height="8" fill="#EC4899" transform="rotate(45 154 84)"/>
  <rect x="250" y="90" width="8" height="8" fill="#10B981" transform="rotate(30 254 94)"/>
  <rect x="120" y="320" width="8" height="8" fill="#F59E0B" transform="rotate(60 124 324)"/>
  <rect x="280" y="310" width="8" height="8" fill="#3B82F6" transform="rotate(15 284 314)"/>
  
  <!-- Stars -->
  <path d="M 90 150 L 95 165 L 110 167 L 98 178 L 101 193 L 90 185 L 79 193 L 82 178 L 70 167 L 85 165 Z" fill="#FCD34D"/>
  <path d="M 310 170 L 315 185 L 330 187 L 318 198 L 321 213 L 310 205 L 299 213 L 302 198 L 290 187 L 305 185 Z" fill="#FCD34D"/>
  
  <!-- Floating Money -->
  <text x="60" y="200" font-family="Arial" font-size="28" fill="#10B981" font-weight="bold">₹</text>
  <text x="330" y="220" font-family="Arial" font-size="28" fill="#10B981" font-weight="bold">₹</text>
  
  <!-- Success Text -->
  <text x="200" y="330" font-family="Arial" font-size="24" fill="#0F172A" font-weight="bold" text-anchor="middle">Order Confirmed!</text>
  <text x="200" y="360" font-family="Arial" font-size="14" fill="#64748B" text-anchor="middle">Your order has been placed successfully</text>
</svg>