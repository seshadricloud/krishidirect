<svg width="400" height="500" viewBox="0 0 400 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E0F7FA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B2EBF2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="field" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8BC34A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#689F38;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="person" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9800;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F57C00;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Sky Background -->
  <rect width="400" height="300" fill="url(#sky)"/>
  
  <!-- Sun -->
  <circle cx="320" cy="80" r="40" fill="#FFC107" opacity="0.8"/>
  
  <!-- Mountains -->
  <path d="M 0 200 L 80 120 L 160 200 Z" fill="#81C784" opacity="0.6"/>
  <path d="M 100 200 L 200 100 L 300 200 Z" fill="#66BB6A" opacity="0.7"/>
  <path d="M 240 200 L 340 140 L 400 200 Z" fill="#4CAF50" opacity="0.6"/>
  
  <!-- Field -->
  <rect y="200" width="400" height="300" fill="url(#field)"/>
  
  <!-- Crop Rows -->
  <line x1="0" y1="240" x2="400" y2="240" stroke="#689F38" stroke-width="2" opacity="0.4"/>
  <line x1="0" y1="280" x2="400" y2="280" stroke="#689F38" stroke-width="2" opacity="0.4"/>
  <line x1="0" y1="320" x2="400" y2="320" stroke="#689F38" stroke-width="2" opacity="0.4"/>
  <line x1="0" y1="360" x2="400" y2="360" stroke="#689F38" stroke-width="2" opacity="0.4"/>
  
  <!-- Plants -->
  <g opacity="0.6">
    <ellipse cx="50" cy="250" rx="8" ry="15" fill="#2E7D32"/>
    <ellipse cx="80" cy="250" rx="8" ry="15" fill="#2E7D32"/>
    <ellipse cx="110" cy="250" rx="8" ry="15" fill="#2E7D32"/>
    <ellipse cx="150" cy="290" rx="8" ry="15" fill="#2E7D32"/>
    <ellipse cx="180" cy="290" rx="8" ry="15" fill="#2E7D32"/>
    <ellipse cx="210" cy="290" rx="8" ry="15" fill="#2E7D32"/>
    <ellipse cx="250" cy="330" rx="8" ry="15" fill="#2E7D32"/>
    <ellipse cx="280" cy="330" rx="8" ry="15" fill="#2E7D32"/>
    <ellipse cx="310" cy="330" rx="8" ry="15" fill="#2E7D32"/>
  </g>
  
  <!-- Farmer with phone -->
  <g transform="translate(280, 320)">
    <!-- Body -->
    <ellipse cx="0" cy="40" rx="25" ry="35" fill="url(#person)"/>
    <!-- Head -->
    <circle cx="0" cy="0" r="20" fill="#D4A574"/>
    <!-- Hair -->
    <path d="M -15 -5 Q -18 -15 -10 -18 Q 0 -20 10 -18 Q 18 -15 15 -5" fill="#2C1810"/>
    <!-- Phone -->
    <rect x="15" y="20" width="20" height="30" rx="2" fill="#1E88E5"/>
    <rect x="17" y="22" width="16" height="22" rx="1" fill="#BBDEFB"/>
    <!-- Arm -->
    <path d="M 15 30 L 32 25" stroke="#D4A574" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Farmer with basket -->
  <g transform="translate(120, 340)">
    <!-- Body -->
    <ellipse cx="0" cy="40" rx="25" ry="35" fill="#8D6E63"/>
    <!-- Head -->
    <circle cx="0" cy="0" r="20" fill="#D4A574"/>
    <!-- Hair -->
    <path d="M -15 -5 Q -18 -15 -10 -18 Q 0 -20 10 -18 Q 18 -15 15 -5" fill="#2C1810"/>
    <!-- Basket -->
    <ellipse cx="-25" cy="45" rx="15" ry="20" fill="#A1887F"/>
    <path d="M -40 45 L -10 45" stroke="#6D4C41" stroke-width="2"/>
    <path d="M -37 50 L -13 50" stroke="#6D4C41" stroke-width="2"/>
    <!-- Arm -->
    <path d="M -15 35 L -25 45" stroke="#D4A574" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Vegetables in basket -->
  <g transform="translate(95, 385)">
    <circle cx="0" cy="0" r="5" fill="#F44336"/>
    <circle cx="10" cy="-2" r="5" fill="#FF9800"/>
    <circle cx="5" cy="5" r="5" fill="#CDDC39"/>
  </g>
  
  <!-- Mobile UI Elements Floating -->
  <g opacity="0.9" transform="translate(40, 100)">
    <rect width="80" height="50" rx="8" fill="white" filter="drop-shadow(0 4px 8px rgba(0,0,0,0.1))"/>
    <rect x="10" y="10" width="30" height="30" rx="4" fill="#E8F5E9"/>
    <path d="M 20 20 L 20 30 L 30 25 Z" fill="#2F9E44"/>
    <text x="45" y="22" font-family="Arial" font-size="10" fill="#2F9E44" font-weight="bold">₹450</text>
    <text x="45" y="35" font-family="Arial" font-size="8" fill="#666">per kg</text>
  </g>
  
  <g opacity="0.9" transform="translate(280, 180)">
    <rect width="70" height="40" rx="8" fill="white" filter="drop-shadow(0 4px 8px rgba(0,0,0,0.1))"/>
    <circle cx="20" cy="20" r="10" fill="#FFE0B2"/>
    <path d="M 20 15 L 20 25 M 15 20 L 25 20" stroke="#FF9800" stroke-width="2"/>
    <text x="35" y="25" font-family="Arial" font-size="9" fill="#333" font-weight="bold">Order</text>
  </g>
</svg>