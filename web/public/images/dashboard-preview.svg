<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Browser Window -->
  <rect width="600" height="400" rx="12" fill="#E2E8F0"/>
  <rect y="30" width="600" height="370" fill="#FFFFFF"/>
  
  <!-- Browser Bar -->
  <circle cx="20" cy="15" r="5" fill="#EF4444"/>
  <circle cx="40" cy="15" r="5" fill="#F59E0B"/>
  <circle cx="60" cy="15" r="5" fill="#10B981"/>
  
  <!-- Sidebar -->
  <rect width="200" height="370" y="30" fill="#F8FAFC"/>
  <text x="30" y="70" font-family="Arial" font-size="18" fill="#2F9E44" font-weight="bold">KrishiDirect</text>
  
  <g transform="translate(30, 100)">
    <rect width="140" height="40" rx="8" fill="#2F9E44"/>
    <text x="15" y="25" font-family="Arial" font-size="14" fill="#FFFFFF" font-weight="bold">Dashboard</text>
  </g>
  
  <g transform="translate(30, 150)">
    <rect width="140" height="40" rx="8" fill="transparent"/>
    <text x="15" y="25" font-family="Arial" font-size="14" fill="#64748B">Products</text>
  </g>
  
  <g transform="translate(30, 200)">
    <rect width="140" height="40" rx="8" fill="transparent"/>
    <text x="15" y="25" font-family="Arial" font-size="14" fill="#64748B">Orders</text>
  </g>
  
  <g transform="translate(30, 250)">
    <rect width="140" height="40" rx="8" fill="transparent"/>
    <text x="15" y="25" font-family="Arial" font-size="14" fill="#64748B">Analytics</text>
  </g>
  
  <!-- Main Content -->
  <!-- Stats Cards -->
  <g transform="translate(220, 50)">
    <rect width="110" height="80" rx="8" fill="#DBEAFE"/>
    <text x="15" y="30" font-family="Arial" font-size="24" fill="#1E40AF" font-weight="bold">152</text>
    <text x="15" y="55" font-family="Arial" font-size="12" fill="#64748B">Total Products</text>
  </g>
  
  <g transform="translate(350, 50)">
    <rect width="110" height="80" rx="8" fill="#DCFCE7"/>
    <text x="15" y="30" font-family="Arial" font-size="24" fill="#15803D" font-weight="bold">89</text>
    <text x="15" y="55" font-family="Arial" font-size="12" fill="#64748B">Active Orders</text>
  </g>
  
  <g transform="translate(480, 50)">
    <rect width="110" height="80" rx="8" fill="#FEF3C7"/>
    <text x="15" y="30" font-family="Arial" font-size="20" fill="#B45309" font-weight="bold">₹45.2k</text>
    <text x="15" y="55" font-family="Arial" font-size="12" fill="#64748B">Revenue</text>
  </g>
  
  <!-- Chart -->
  <g transform="translate(220, 160)">
    <rect width="370" height="200" rx="8" fill="#F8FAFC"/>
    <text x="15" y="25" font-family="Arial" font-size="14" fill="#0F172A" font-weight="bold">Sales Overview</text>
    
    <!-- Bar Chart -->
    <rect x="30" y="130" width="40" height="40" fill="#2F9E44" opacity="0.3"/>
    <rect x="80" y="100" width="40" height="70" fill="#2F9E44" opacity="0.5"/>
    <rect x="130" y="80" width="40" height="90" fill="#2F9E44" opacity="0.7"/>
    <rect x="180" y="60" width="40" height="110" fill="#2F9E44"/>
    <rect x="230" y="90" width="40" height="80" fill="#2F9E44" opacity="0.6"/>
    <rect x="280" y="110" width="40" height="60" fill="#2F9E44" opacity="0.4"/>
    <rect x="330" y="70" width="40" height="100" fill="#2F9E44" opacity="0.8"/>
    
    <!-- Axis -->
    <line x1="20" y1="170" x2="370" y2="170" stroke="#CBD5E1" stroke-width="2"/>
    <line x1="20" y1="50" x2="20" y2="170" stroke="#CBD5E1" stroke-width="2"/>
  </g>
  
  <!-- Notification Badge -->
  <circle cx="550" cy="60" r="12" fill="#EF4444"/>
  <text x="545" y="65" font-family="Arial" font-size="12" fill="#FFFFFF" font-weight="bold">5</text>
</svg>