<svg width="500" height="400" viewBox="0 0 500 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8F5E9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFF3E0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="500" height="400" fill="url(#bg)"/>
  
  <!-- Market Stalls -->
  <g transform="translate(50, 200)">
    <!-- Stall 1 -->
    <path d="M 0 100 L 20 50 L 80 50 L 100 100 Z" fill="#EF4444"/>
    <rect y="100" width="100" height="80" fill="#DC2626"/>
    <rect x="10" y="110" width="35" height="35" fill="#FCA5A5"/>
    <rect x="55" y="110" width="35" height="35" fill="#FCA5A5"/>
    <rect x="10" y="155" width="35" height="20" fill="#FCA5A5"/>
    <rect x="55" y="155" width="35" height="20" fill="#FCA5A5"/>
    <!-- Tomatoes -->
    <circle cx="27" cy="127" r="6" fill="#EF4444"/>
    <circle cx="72" cy="127" r="6" fill="#EF4444"/>
  </g>
  
  <g transform="translate(180, 200)">
    <!-- Stall 2 -->
    <path d="M 0 100 L 20 50 L 80 50 L 100 100 Z" fill="#FB923C"/>
    <rect y="100" width="100" height="80" fill="#F97316"/>
    <rect x="10" y="110" width="35" height="35" fill="#FED7AA"/>
    <rect x="55" y="110" width="35" height="35" fill="#FED7AA"/>
    <rect x="10" y="155" width="35" height="20" fill="#FED7AA"/>
    <rect x="55" y="155" width="35" height="20" fill="#FED7AA"/>
    <!-- Carrots -->
    <path d="M 27 120 L 27 135" stroke="#F97316" stroke-width="3"/>
    <path d="M 72 120 L 72 135" stroke="#F97316" stroke-width="3"/>
  </g>
  
  <g transform="translate(310, 200)">
    <!-- Stall 3 -->
    <path d="M 0 100 L 20 50 L 80 50 L 100 100 Z" fill="#4ADE80"/>
    <rect y="100" width="100" height="80" fill="#22C55E"/>
    <rect x="10" y="110" width="35" height="35" fill="#BBF7D0"/>
    <rect x="55" y="110" width="35" height="35" fill="#BBF7D0"/>
    <rect x="10" y="155" width="35" height="20" fill="#BBF7D0"/>
    <rect x="55" y="155" width="35" height="20" fill="#BBF7D0"/>
    <!-- Leafy -->
    <ellipse cx="27" cy="127" rx="8" ry="12" fill="#16A34A"/>
    <ellipse cx="72" cy="127" rx="8" ry="12" fill="#16A34A"/>
  </g>
  
  <!-- People Shopping -->
  <g transform="translate(120, 310)">
    <circle cx="0" cy="0" r="12" fill="#D4A574"/>
    <ellipse cx="0" cy="25" rx="15" ry="20" fill="#3B82F6"/>
    <rect x="-8" y="35" width="16" height="8" fill="#8B5CF6"/>
  </g>
  
  <g transform="translate(250, 320)">
    <circle cx="0" cy="0" r="12" fill="#D4A574"/>
    <ellipse cx="0" cy="25" rx="15" ry="20" fill="#EC4899"/>
    <circle cx="15" cy="30" r="10" fill="#FDE68A"/>
  </g>
  
  <!-- Farmer with cart -->
  <g transform="translate(380, 300)">
    <circle cx="0" cy="0" r="12" fill="#D4A574"/>
    <ellipse cx="0" cy="25" rx="15" ry="20" fill="#8D6E63"/>
    <!-- Cart -->
    <rect x="10" y="20" width="30" height="25" fill="#A1887F"/>
    <circle cx="15" cy="48" r="5" fill="#4B5563"/>
    <circle cx="35" cy="48" r="5" fill="#4B5563"/>
  </g>
  
  <!-- Price Tags Floating -->
  <g transform="translate(100, 100)">
    <rect width="60" height="40" rx="8" fill="white" filter="drop-shadow(0 4px 8px rgba(0,0,0,0.1))"/>
    <text x="10" y="25" font-family="Arial" font-size="16" fill="#2F9E44" font-weight="bold">₹45/kg</text>
  </g>
  
  <g transform="translate(280, 80)">
    <rect width="60" height="40" rx="8" fill="white" filter="drop-shadow(0 4px 8px rgba(0,0,0,0.1))"/>
    <text x="10" y="25" font-family="Arial" font-size="16" fill="#F97316" font-weight="bold">₹30/kg</text>
  </g>
  
  <!-- Sun -->
  <circle cx="450" cy="50" r="30" fill="#FCD34D" opacity="0.8"/>
  
  <!-- Title -->
  <text x="250" y="40" font-family="Arial" font-size="24" fill="#0F172A" font-weight="bold" text-anchor="middle">Direct Market Access</text>
</svg>