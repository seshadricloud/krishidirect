version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://backend:5000
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=your_database_url_here
      - JWT_SECRET=your_jwt_secret_here
    volumes:
      - ./backend:/app
    command: npm run start

networks:
  default:
    driver: bridge